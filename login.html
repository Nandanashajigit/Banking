<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Ledger Banking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,700;1,300&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-shell">

    <div class="auth-panel-brand">
      <a href="index.html" class="brand">Ledger <span></span> Banking</a>
      <blockquote class="auth-quote">
        "A balance you can trust is one you can always see."
        <div class="auth-quote-attr">— the second rule of the ledger</div>
      </blockquote>
      <p class="demo-notice">This is a learning demo. Accounts are stored only in this browser, not on a real server.</p>
    </div>

    <div class="auth-panel-form">
      <div class="auth-form-box">
        <h1>Welcome back</h1>
        <p class="auth-form-sub">Log in to see your balance.</p>

        <div id="flashMessage" class="flash-message" style="display:none;"></div>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" >
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" >
          </div>

          <div id="loginError" class="form-error" role="alert"></div>

          <button type="submit" class="btn btn-solid btn-block">Log in</button>
        </form>

        <p class="form-note">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    const flash = sessionStorage.getItem('lv_flash');
    if (flash) {
      const flashEl = document.getElementById('flashMessage');
      flashEl.textContent = flash;
      flashEl.style.display = 'block';
      sessionStorage.removeItem('lv_flash');
    }

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();
      lvClearError(loginError);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        lvShowError(loginError, 'Please enter both email and password.');
        return;
      }

      const user = lvFindUser(email);

      if (!user || user.password !== password) {
        lvShowError(loginError, 'Incorrect email or password.');
        return;
      }

      lvSetSession(user.email);
      window.location.href = 'home.html';
    });
  </script>

</body>
</html>
